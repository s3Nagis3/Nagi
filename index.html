<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ash 作戦ボード</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ash">
<meta name="theme-color" content="#161616">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f2f2f2;--pn:#fff;--bt:#ddd;--fg:#111;--mu:#666;--ln:#ccc;--ac:#00acc1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--pn:#242424;--bt:#444;--fg:#fff;--mu:#aaa;--ln:#444}}
:root[data-theme="dark"]{--bg:#161616;--pn:#242424;--bt:#444;--fg:#fff;--mu:#aaa;--ln:#444}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
#top,#bar{display:flex;gap:6px;padding:6px;align-items:center;flex-wrap:wrap;background:var(--pn);border-bottom:1px solid var(--ln)}
#bar{border-top:1px solid var(--ln)}
button,select{background:var(--bt);color:var(--fg);border:0;border-radius:8px;padding:0 12px;min-height:40px;font-size:14px;font-weight:700;font-family:inherit}
button.on{background:var(--ac);color:#000}
button.del.on{background:#f44336;color:#fff}
button.g{background:#43a047;color:#fff}
#fm{width:100%}
button{touch-action:manipulation}
#sd.atk{background:#e53935;color:#fff}
#sd.def{background:#1e88e5;color:#fff}
#sk{flex:none;padding:6px 8px 8px;background:var(--pn);border-bottom:2px solid var(--ac);max-height:32vh;overflow-y:auto}
.skh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:6px}
.skh span{flex:1;min-width:0}
.skh button{min-height:32px;padding:0 10px}
button.pick{outline:3px solid var(--ac)}
.skb{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;text-align:left;font-size:13px}
.skb img{width:34px;height:34px;border-radius:6px;flex:none}
.fc{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px}
select{flex:1;min-width:0}
#stg{padding:6px 0;flex:none}
#wrap{position:relative;margin:0 auto}
#cv{display:block;width:100%;height:100%;touch-action:none;background:#111;border-radius:6px}
#zm{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:6px}
#zm button{width:42px;min-height:42px;padding:0;font-size:20px;background:rgba(0,0,0,.6);color:#fff}
#zm #zr{font-size:11px}
.dot{width:30px;height:30px;border-radius:50%;border:3px solid transparent;flex:none}
.dot.on{border-color:var(--fg)}
#pal{flex:1;overflow-y:auto;padding:6px 8px 12px;-webkit-overflow-scrolling:touch}
#pal h3{margin:8px 0 4px;font-size:12px;color:var(--mu)}
#pal p{margin:6px 0 0;font-size:12px;color:var(--mu);line-height:1.5}
.row{display:flex;gap:6px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;min-height:40px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--fg);padding:0 10px;font-size:16px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;padding:8px;box-sizing:border-box;color:#fff;text-align:center;font-size:13px}
.ov.show{display:flex}
#cc{touch-action:none;max-width:100%}
#shot{max-width:100%;max-height:70%;border-radius:6px}
</style>
</head>
<body>
<div id="top">
  <button id="sd">⚔ 攻撃</button>
  <select id="ms"></select>
  <button id="imp" aria-label="マップ画像を読み込む">🖼 画像</button>
  <button id="sv" class="g">📷 保存</button>
</div>
<div id="stg"><div id="wrap">
  <canvas id="cv"></canvas>
  <div id="zm"><button id="zi" aria-label="拡大">＋</button><button id="zo" aria-label="縮小">－</button><button id="zr" aria-label="全体表示">1.0×</button></div>
</div></div>
<div id="bar">
  <button id="m-move" class="on">移動</button>
  <button id="m-draw">作戦線</button>
  <button id="m-erase" class="del">消去</button>
  <button id="st">実線</button>
  <span id="cols" class="row" style="gap:8px"></span>
  <button id="undo">↩ 戻す</button>
  <button id="clr">全消去</button>
</div>
<div id="sk" hidden></div>
<div id="pal"></div>
<input type="file" id="file" accept="image/*" hidden>

<div id="crop" class="ov">
  <div id="ct">ドラッグで範囲を選択（マップ部分）。4:3で切り抜きます</div>
  <canvas id="cc"></canvas>
  <div class="row"><button id="c-no">キャンセル</button><button id="c-ok" class="g">決定</button></div>
</div>
<div id="shotov" class="ov">
  <div>画像を長押しして保存してください</div>
  <img id="shot" alt="作戦ボード">
  <button id="s-close">閉じる</button>
</div>

const store=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const load=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
let side=load('dp_side')==='def'?'def':'atk';
const ik=()=>cur+(side==='def'?'_def':'');
const persist=()=>store('dp_i_'+ik(),JSON.stringify(items[ik()]));
for(const k in MAPS){
  for(const q of [k,k+'_def']){try{items[q]=JSON.parse(load('dp_i_'+q)||'[]')||[]}catch(e){items[q]=[]}}
  const d=load('dp_b2_'+k);
  let s=null,zz=[800,600];
  if(d){s=d}else if(DEF[k]){s=DEF[k].s;zz=[DEF[k].w,DEF[k].h]}
  SZ[k]=zz;
  if(s){const im=new Image();im.onload=draw;im.src=s;bg[k]=im}
}
function fit(){
  W=SZ[cur][0];H=SZ[cur][1];cv.width=W*K;cv.height=H*K;
  wrap.style.aspectRatio=W+'/'+H;wrap.style.width='min(100%,'+(50*W/H).toFixed(1)+'vh)';
  z=1;ox=oy=0;sel=null;
}

/* ---------- ズーム ---------- */
function clampView(){
  z=Math.max(1,Math.min(6,z));
  ox=Math.max(0,Math.min(W-W/z,ox));oy=Math.max(0,Math.min(H-H/z,oy));
  $('#zr').textContent=z.toFixed(1)+'×';
}
function zoomAt(s,f){
  const v=[s[0]/z+ox,s[1]/z+oy];
  z=Math.max(1,Math.min(6,z*f));
  ox=v[0]-s[0]/z;oy=v[1]-s[1]/z;clampView();draw();
}
$('#zi').onclick=()=>zoomAt([W/2,H/2],1.4);
$('#zo').onclick=()=>zoomAt([W/2,H/2],1/1.4);
$('#zr').onclick=()=>{z=1;ox=oy=0;clampView();draw()};
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(sp(e),e.deltaY<0?1.15:1/1.15)},{passive:false});

/* ---------- 描画 ---------- */
const hx=o=>o.x+Math.cos(o.a||0)*o.r, hy=o=>o.y+Math.sin(o.a||0)*o.r;
const midP=o=>o.m?[o.x+o.m[0],o.y+o.m[1]]:[(o.x+hx(o))/2,(o.y+hy(o))/2];
function bendPath(o){
  const e=[hx(o),hy(o)],m=midP(o),c=[2*m[0]-(o.x+e[0])/2,2*m[1]-(o.y+e[1])/2],L=[],Rr=[],N=28,h=o.w/2;
  for(let i=0;i<=N;i++){
    const t=i/N,u=1-t;
    const px=u*u*o.x+2*u*t*c[0]+t*t*e[0],py=u*u*o.y+2*u*t*c[1]+t*t*e[1];
    let tx=2*u*(c[0]-o.x)+2*t*(e[0]-c[0]),ty=2*u*(c[1]-o.y)+2*t*(e[1]-c[1]);const l=Math.hypot(tx,ty)||1;tx/=l;ty/=l;
    L.push([px-ty*h,py+tx*h]);Rr.push([px+ty*h,py-tx*h]);
  }
  ctx.beginPath();L.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
  for(let i=N;i>=0;i--)ctx.lineTo(Rr[i][0],Rr[i][1]);ctx.closePath();
}
function drawGad(o){
  const k=o.k||'circle';
  ctx.lineWidth=2;ctx.fillStyle=o.f;ctx.strokeStyle=o.s;
  if(k==='circle'){ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();ctx.stroke()}
  else if(k==='bend'){ctx.lineJoin='round';bendPath(o);ctx.fill();ctx.stroke()}
  else if(k==='beam'){
    ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.a||0);
    ctx.beginPath();ctx.rect(0,-o.w/2,o.r,o.w);ctx.fill();ctx.stroke();ctx.restore();
  }else if(k==='sector'){
    const a=o.a||0,h=(o.ang||Math.PI/2)/2;
    ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.arc(o.x,o.y,o.r,a-h,a+h);ctx.closePath();ctx.fill();ctx.stroke();
  }else if(k==='knife'){
    ctx.save();ctx.setLineDash([8,6]);ctx.beginPath();ctx.arc(o.x,o.y,o.r*3,0,7);ctx.globalAlpha=.4;ctx.fill();ctx.globalAlpha=1;ctx.stroke();ctx.restore();
    ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill();ctx.stroke();
  }
  ctx.save();ctx.translate(o.x,o.y);ctx.scale(1/z,1/z);ctx.translate(-o.x,-o.y);gadBadge(o,k);ctx.restore();
}
function gadBadge(o,k){
  const ii=o.ic&&ICIMG[o.ic];
  if(ii&&ii.complete&&ii.naturalWidth){
    const q=o.ic==='NC8'?15:k==='icon'?19.2:15.6;
    ctx.save();ctx.beginPath();ctx.arc(o.x,o.y,q,0,7);ctx.clip();ctx.drawImage(ii,o.x-q,o.y-q,q*2,q*2);ctx.restore();
    ctx.beginPath();ctx.arc(o.x,o.y,q,0,7);ctx.lineWidth=2;ctx.strokeStyle=o.s;ctx.stroke();return;
  }
  ctx.beginPath();ctx.arc(o.x,o.y,11,0,7);ctx.fillStyle='rgba(0,0,0,.65)';ctx.fill();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.fillText(o.l||'',o.x,o.y+1);
}
function drawItem(o){
  if(o.t==='op'||o.t==='pin'||o.t==='memo'){ctx.save();ctx.translate(o.x,o.y);ctx.scale(1/z,1/z);ctx.translate(-o.x,-o.y);drawItem0(o);ctx.restore()}
  else drawItem0(o);
}
function drawItem0(o){
  ctx.setLineDash([]);
  if(o.t==='line'){
    ctx.strokeStyle=ctx.fillStyle=o.c;ctx.lineWidth=5;ctx.lineCap=ctx.lineJoin='round';
    ctx.setLineDash(o.d?[14,10]:[]);
    ctx.beginPath();o.pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    ctx.setLineDash([]);
    const e=o.pts[o.pts.length-1];let q=o.pts[0];
    for(let i=o.pts.length-2;i>=0;i--){if(Math.hypot(e[0]-o.pts[i][0],e[1]-o.pts[i][1])>10){q=o.pts[i];break}}
    const a=Math.atan2(e[1]-q[1],e[0]-q[0]);
    ctx.beginPath();ctx.moveTo(e[0]+Math.cos(a)*10,e[1]+Math.sin(a)*10);
    ctx.lineTo(e[0]+Math.cos(a+2.5)*16,e[1]+Math.sin(a+2.5)*16);
    ctx.lineTo(e[0]+Math.cos(a-2.5)*16,e[1]+Math.sin(a-2.5)*16);ctx.closePath();ctx.fill();
  }else if(o.t==='op'){
    const f=faces[o.n];
    if(f&&f.complete&&f.naturalWidth){
      ctx.save();ctx.beginPath();ctx.arc(o.x,o.y,20,0,7);ctx.clip();ctx.drawImage(f,o.x-20,o.y-20,40,40);ctx.restore();
      ctx.beginPath();ctx.arc(o.x,o.y,20,0,7);ctx.lineWidth=3;ctx.strokeStyle=o.c;ctx.stroke();return;
    }
    ctx.beginPath();ctx.arc(o.x,o.y,20,0,7);ctx.fillStyle=o.c;ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke();
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';
    ctx.fillText(o.n[0],o.x,o.y+1);
    ctx.font='bold 10px sans-serif';ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(o.n,o.x,o.y+28);ctx.fillText(o.n,o.x,o.y+28);
  }else if(o.t==='pin'){
    ctx.beginPath();ctx.arc(o.x,o.y,11,0,7);ctx.fillStyle=o.c||'#ff1744';ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle=o.c==='#ffeb3b'?'#000':'#fff';ctx.stroke();
  }else if(o.t==='gad'){drawGad(o)}
  else if(o.t==='memo'){
    ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const w=ctx.measureText(o.s).width+16;
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(o.x-w/2,o.y-16,w,32);
    ctx.fillStyle='#fff';ctx.fillText(o.s,o.x,o.y+1);
  }
}
function drawHandle(o){
  const x=hx(o),y=hy(o);
  ctx.setLineDash([]);ctx.lineWidth=2/z;ctx.strokeStyle='rgba(255,255,255,.8)';
  ctx.beginPath();ctx.moveTo(o.x,o.y);ctx.lineTo(x,y);ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,12/z,0,7);ctx.fillStyle='#fff';ctx.fill();
  ctx.lineWidth=3/z;ctx.strokeStyle='#00acc1';ctx.stroke();
  if(o.k==='bend'){
    const m=midP(o);
    ctx.beginPath();ctx.arc(m[0],m[1],12/z,0,7);ctx.fillStyle='#ffeb3b';ctx.fill();
    ctx.lineWidth=3/z;ctx.strokeStyle='#000';ctx.stroke();
  }
}
function draw(){
  ctx.setTransform(K,0,0,K,0,0);ctx.clearRect(0,0,W,H);
  ctx.setTransform(K*z,0,0,K*z,-ox*K*z,-oy*K*z);
  ctx.fillStyle='#161616';ctx.fillRect(0,0,W,H);
  const im=bg[cur];
  if(im&&im.complete&&im.naturalWidth){if(side==='def'){ctx.save();ctx.translate(W,H);ctx.rotate(Math.PI);ctx.drawImage(im,0,0,W,H);ctx.restore()}else ctx.drawImage(im,0,0,W,H)}
  else{
    ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();
    for(let i=100;i<W;i+=100){ctx.moveTo(i,0);ctx.lineTo(i,H)}
    for(let j=100;j<H;j+=100){ctx.moveTo(0,j);ctx.lineTo(W,j)}
    ctx.stroke();
    ctx.fillStyle='#888';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='bold 30px sans-serif';ctx.fillText(MAPS[cur],W/2,H/2-20);
    ctx.font='20px sans-serif';ctx.fillText('「🖼 マップ画像」でスクショを読み込み',W/2,H/2+20);
  }
  items[ik()].forEach(drawItem);
  if(tmp)drawItem(tmp);
  if(sel&&items[ik()].includes(sel))drawHandle(sel);
}

/* ---------- 当たり判定・操作 ---------- */
function segDist(a,b,x,y){
  const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
  let t=l?((x-a[0])*dx+(y-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(x-(a[0]+t*dx),y-(a[1]+t*dy));
}
function hit(o,x,y){
  if(o.t==='op')return Math.hypot(o.x-x,o.y-y)<=26/z;
  if(o.t==='pin')return Math.hypot(o.x-x,o.y-y)<=20/z;
  if(o.t==='gad'){const k=o.k||'circle',d=Math.hypot(o.x-x,o.y-y);return d<=(k==='circle'||k==='knife'?Math.max(24/z,Math.min(o.r,36)):26/z)}
  if(o.t==='memo'){ctx.font='bold 20px sans-serif';const w=(ctx.measureText(o.s).width/2+8)/z;return Math.abs(x-o.x)<=w&&Math.abs(y-o.y)<=18/z}
  for(let i=1;i<o.pts.length;i++)if(segDist(o.pts[i-1],o.pts[i],x,y)<14/Math.min(z,2))return true;
  return false;
}
const hitHandle=(o,x,y)=>Math.hypot(hx(o)-x,hy(o)-y)<=22/z;
const hitMid=(o,x,y)=>{if(o.k!=='bend')return false;const m=midP(o);return Math.hypot(m[0]-x,m[1]-y)<=22/z};
let hdlMid=false;
function sp(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
const toV=s=>[s[0]/z+ox,s[1]/z+oy];
const ptrs=new Map();let pinch=null,pan=null;
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId,sp(e));
  if(ptrs.size===2){
    tmp=null;drag=null;hdl=null;pan=null;
    const[a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,z0:z,v:toV([(a[0]+b[0])/2,(a[1]+b[1])/2])};
    draw();return;
  }
  if(ptrs.size>2)return;
  const s=sp(e),[x,y]=toV(s),a=items[ik()];
  if(sel&&mode==='move'&&items[ik()].includes(sel)&&(hitHandle(sel,x,y)||hitMid(sel,x,y))){hdlMid=!hitHandle(sel,x,y);hdl=sel;draw();return}
  if(mode==='draw'){tmp={t:'line',pts:[[x,y]],c:color,d:dash};sel=null}
  else{
    let found=false;
    for(let i=a.length-1;i>=0;i--){
      const o=a[i];
      if(!hit(o,x,y))continue;
      found=true;
      if(mode==='erase'){a.splice(i,1);if(sel===o)sel=null;persist()}
      else if(o.t!=='line'){a.push(a.splice(i,1)[0]);drag={o,dx:o.x-x,dy:o.y-y};sel=o.t==='gad'&&o.k!=='icon'?o:null}
      else sel=null;
      break;
    }
    if(!found){sel=null;if(mode==='move')pan={s,ox,oy}}
  }
  draw();
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  const s=sp(e);ptrs.set(e.pointerId,s);
  if(pinch){
    if(ptrs.size<2)return;
    const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1])||1,c=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    z=Math.max(1,Math.min(6,pinch.z0*d/pinch.d));
    ox=pinch.v[0]-c[0]/z;oy=pinch.v[1]-c[1]/z;clampView();draw();return;
  }
  const[x,y]=toV(s);
  if(hdl){
    const dx=x-hdl.x,dy=y-hdl.y;
    if(hdlMid)hdl.m=[dx,dy];
    else{hdl.a=Math.atan2(dy,dx);hdl.r=Math.max(10,Math.hypot(dx,dy))}
  }else if(tmp){const l=tmp.pts[tmp.pts.length-1];if(Math.hypot(x-l[0],y-l[1])>3/Math.min(z,2))tmp.pts.push([x,y])}
  else if(drag){drag.o.x=Math.max(0,Math.min(W,x+drag.dx));drag.o.y=Math.max(0,Math.min(H,y+drag.dy))}
  else if(pan){ox=pan.ox-(s[0]-pan.s[0])/z;oy=pan.oy-(s[1]-pan.s[1])/z;clampView()}
  else return;
  draw();
});
const up=e=>{
  ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;draw();return}
  if(tmp){if(tmp.pts.length>1){items[ik()].push(tmp);persist()}tmp=null}
  if(drag){persist();drag=null}
  if(hdl){persist();hdl=null}
  pan=null;draw();
};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

  clearTimeout(tapT);tapN=n;tapT=setTimeout(()=>{tapT=null;showSkills(n)},280);

function showSkills(n){
  skN=n;sk.textContent='';

  const f=faces[n];if(f){const i=document.createElement('img');i.src=f.src;i.alt='';i.className='fc';h.appendChild(i)}

  const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','閉じる');x.onclick=hideSkills;h.appendChild(x);
  sk.appendChild(h);
  const r=document.createElement('div');r.className='row';sk.appendChild(r);
  (SKILLS[n]||[]).forEach(([label,g])=>{const b=document.createElement('button');b.className='skb';if(ICONS[g.ic]){const i=document.createElement('img');i.src=ICONS[g.ic];i.alt='';b.appendChild(i)}b.appendChild(document.createTextNode(label));b.style.borderLeft='6px solid '+g.s;

  const p=document.createElement('button');p.textContent='＋ キャラを置く';p.className='g';p.onclick=()=>add({t:'op',n,c:OPC[n]});r.appendChild(p);

}

document.querySelectorAll('button[data-n]').forEach(b=>{
  const d=load('dp_f_'+b.dataset.n)||DEFF[b.dataset.n];
  if(d){const im=new Image();im.onload=draw;im.src=d;faces[b.dataset.n]=im}
});
refreshFaces();
const gd=(label,g)=>[label,()=>add(Object.assign({t:'gad',a:0},g))];
group('汎用の範囲',[
  gd('☁️ スモーク',{k:'circle',l:'煙',f:'rgba(150,150,150,.55)',s:'#ddd',r:24}),
  gd('⚠️ トラップ',{k:'circle',l:'罠',f:'rgba(244,67,54,.45)',s:'#f44336',r:16}),
  gd('◯ 円形索敵',{k:'circle',l:'探',f:'rgba(33,150,243,.3)',s:'#2196f3',r:40}),
  gd('➖ 直線索敵',{k:'beam',l:'線',f:'rgba(33,150,243,.3)',s:'#2196f3',r:160,w:24}),
  gd('◔ 扇形(90°)',{k:'sector',l:'扇',f:'rgba(33,150,243,.3)',s:'#2196f3',r:100,ang:90*R})
]);
const hint=document.createElement('p');
hint.textContent='スティンガーの煙幕は、黄色い丸をドラッグすると途中で曲げられます。範囲を置くと、先端に白い丸が出ます。丸をドラッグすると向きと長さを変えられます。ほかの範囲を触ると、その範囲に丸が移ります。サイズはおおよその目安です（1m ≒ 4）。';
pal.appendChild(hint);
const mh=document.createElement('h3');mh.textContent='テキストメモ';pal.appendChild(mh);
const mr=document.createElement('div');mr.className='row';pal.appendChild(mr);
const mi=document.createElement('input');mi.type='text';mi.placeholder='例: Aメイン射線';mr.appendChild(mi);
const mb=document.createElement('button');mb.textContent='追加';mr.appendChild(mb);
mb.onclick=()=>{const s=mi.value.trim();if(s){add({t:'memo',s});mi.value=''}};

/* ---------- 画像保存（全体表示で書き出し） ---------- */
$('#sv').onclick=()=>{
  const s0=[z,ox,oy,sel];z=1;ox=oy=0;sel=null;draw();
  $('#shot').src=cv.toDataURL('image/png');
  [z,ox,oy,sel]=s0;clampView();draw();
  $('#shotov').classList.add('show');
};
$('#s-close').onclick=()=>$('#shotov').classList.remove('show');

/* ---------- スクショ読み込み＋切り抜き ---------- */
const file=$('#file'),cc=$('#cc'),cx=cc.getContext('2d');
let src=null,sc=1,Rc=null,cd=null;
$('#imp').onclick=()=>{cropFor=null;ar=.75;file.click()};
file.onchange=()=>{
  const f=file.files[0];if(!f)return;
  const im=new Image();
  im.onload=()=>{
    src=im;sc=Math.min((innerWidth-16)/im.naturalWidth,(innerHeight-150)/im.naturalHeight);
    cc.width=Math.round(im.naturalWidth*sc);cc.height=Math.round(im.naturalHeight*sc);
    const w=Math.min(cc.width*.6,cc.height*.6/ar);
    Rc={x:(cc.width-w)/2,y:(cc.height-w*ar)/2,w};
    $('#ct').textContent=cropFor?'ドラッグで顔の範囲を選択（'+cropFor+'）。正方形で切り抜きます':'ドラッグで範囲を選択（マップ部分）。4:3で切り抜きます';
    $('#crop').classList.add('show');cdraw();
  };
  im.src=URL.createObjectURL(f);file.value='';
};
function cdraw(){
  cx.drawImage(src,0,0,cc.width,cc.height);
  const h=Rc.w*ar;
  cx.fillStyle='rgba(0,0,0,.55)';
  cx.fillRect(0,0,cc.width,Rc.y);cx.fillRect(0,Rc.y+h,cc.width,cc.height-Rc.y-h);
  cx.fillRect(0,Rc.y,Rc.x,h);cx.fillRect(Rc.x+Rc.w,Rc.y,cc.width-Rc.x-Rc.w,h);
  cx.strokeStyle='#00e5ff';cx.lineWidth=2;cx.strokeRect(Rc.x,Rc.y,Rc.w,h);
}
const cp=e=>{const r=cc.getBoundingClientRect();return[(e.clientX-r.left)*cc.width/r.width,(e.clientY-r.top)*cc.height/r.height]};
cc.addEventListener('pointerdown',e=>{
  e.preventDefault();cc.setPointerCapture(e.pointerId);const[x,y]=cp(e);
  cd=(x>Rc.x&&x<Rc.x+Rc.w&&y>Rc.y&&y<Rc.y+Rc.w*ar)?{m:1,dx:Rc.x-x,dy:Rc.y-y}:{m:0,x0:x,y0:y};
});
cc.addEventListener('pointermove',e=>{
  if(!cd)return;const[x,y]=cp(e);
  if(cd.m){Rc.x=x+cd.dx;Rc.y=y+cd.dy}
  else{
    let w=Math.max(40,Math.abs(x-cd.x0));w=Math.min(w,cc.width,cc.height/ar);
    Rc.w=w;Rc.x=x<cd.x0?cd.x0-w:cd.x0;Rc.y=y<cd.y0?cd.y0-w*ar:cd.y0;
  }
  const h=Rc.w*ar;
  Rc.x=Math.max(0,Math.min(cc.width-Rc.w,Rc.x));Rc.y=Math.max(0,Math.min(cc.height-h,Rc.y));
  cdraw();
});
cc.addEventListener('pointerup',()=>cd=null);cc.addEventListener('pointercancel',()=>cd=null);
$('#c-no').onclick=()=>$('#crop').classList.remove('show');
$('#c-ok').onclick=()=>{
  if(cropFor){
    const t=document.createElement('canvas');t.width=t.height=96;
    t.getContext('2d').drawImage(src,Rc.x/sc,Rc.y/sc,Rc.w/sc,Rc.w/sc,0,0,96,96);
    const d=t.toDataURL('image/jpeg',.85),im=new Image(),n=cropFor;
    im.onload=()=>{refreshFaces();draw()};im.src=d;faces[n]=im;store('dp_f_'+n,d);
    $('#crop').classList.remove('show');return;
  }
  const t=document.createElement('canvas');t.width=800;t.height=600;
  t.getContext('2d').drawImage(src,Rc.x/sc,Rc.y/sc,Rc.w/sc,Rc.w*ar/sc,0,0,800,600);
  const d=t.toDataURL('image/jpeg',.85),im=new Image();
  im.onload=draw;im.src=d;bg[cur]=im;store('dp_b2_'+cur,d);SZ[cur]=[800,600];fit();clampView();draw();
  $('#crop').classList.remove('show');
};
fit();clampView();draw();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
